<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Transfer Rates | Zippygo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://js.stripe.com/v3/"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .StripeElement { background-color: #f8fafc; padding: 14px; border-radius: 12px; border: 1px solid #e2e8f0; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">
    <header class="bg-slate-900 text-white h-20 flex items-center px-6">
        <a href="/index.html" class="text-2xl font-black"><span class="text-emerald-500">Zippy</span>go</a>
    </header>

    <main class="flex-1 max-w-4xl mx-auto px-4 py-12 w-full space-y-6">
        <a href="/index.html" class="text-xs font-bold text-slate-500 hover:text-slate-800 transition block">&larr; Modify Search Parameters</a>
        <h2 id="resultsHeaderTitle" class="text-2xl font-black tracking-tight text-slate-800">Searching matching transit quotes...</h2>
        
        <div id="resultsInjectTarget" class="space-y-4"></div>

        <section id="successReceiptSection" class="bg-white rounded-3xl border shadow-2xl overflow-hidden hidden">
            <div class="bg-emerald-600 px-8 py-10 text-white text-center space-y-2">
                <h2 class="text-3xl font-black">Booking Confirmed!</h2>
                <p class="text-emerald-100 text-sm">Your transfer reservation has been completely secured and processed.</p>
            </div>
            <div class="p-8 space-y-4 text-sm font-semibold text-slate-700" id="receiptSummaryBlock"></div>
        </section>
    </main>

    <div id="checkoutModalOverlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4 overflow-y-auto">
        <div class="bg-white rounded-2xl w-full max-w-xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="bg-slate-900 px-6 py-4 text-white flex items-center justify-between">
                <div>
                    <h3 class="font-bold text-lg">Passenger Booking Panel</h3>
                    <p id="checkoutTargetVehicleSummary" class="text-xs text-slate-400 mt-0.5">Vehicle Route Summary</p>
                </div>
                <button id="closeCheckoutBtn" type="button" class="text-slate-400 hover:text-white font-bold bg-slate-800 p-2 rounded-full w-8 h-8 flex items-center justify-center">✕</button>
            </div>
            <div class="flex-1 overflow-y-auto p-6">
                <form id="checkoutCombinedForm" class="space-y-6">
                    <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 flex items-center justify-between">
                        <div>
                            <span class="text-xs text-slate-500 block font-bold uppercase tracking-wider">Total Booking Amount</span>
                            <span id="checkoutTargetFinalPrice" class="text-3xl font-black text-slate-900">£0.00</span>
                        </div>
                        <span class="text-2xl">🔒</span>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-2">First Name *</label>
                            <input type="text" id="custFirstName" required class="w-full p-3 bg-slate-50 border rounded-xl text-sm focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-2">Last Name *</label>
                            <input type="text" id="custLastName" required class="w-full p-3 bg-slate-50 border rounded-xl text-sm focus:outline-none">
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-2">Email Address *</label>
                            <input type="email" id="custEmail" required class="w-full p-3 bg-slate-50 border rounded-xl text-sm focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-2">Contact Mobile Number *</label>
                            <input type="tel" id="custPhone" required placeholder="+44 7123 456789" class="w-full p-3 bg-slate-50 border rounded-xl text-sm focus:outline-none">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-2">Arrival Flight Number *</label>
                        <input type="text" id="flightNo" required placeholder="e.g., BA-142" class="w-full p-3 bg-slate-50 border rounded-xl text-sm uppercase focus:outline-none">
                    </div>
                    <div>
                        <h4 class="text-sm font-bold text-slate-800 uppercase tracking-wider border-b pb-2 mb-3">Secure Card Details</h4>
                        <div id="stripe-card-element-mount-point"></div>
                    </div>
                    <div id="payment-errors" class="text-xs text-rose-500 font-medium hidden mt-2"></div>
                    <div class="pt-4">
                        <button type="submit" id="paySubmitBtn" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-black py-4 rounded-xl text-sm shadow-lg tracking-wider uppercase transition">Pay & Complete Reservation →</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const stripe = Stripe('pk_test_51TYoQt4xSQ4u2uQiVgNXdjreUGfGFJOeAoSIBGzMa9sZc6g9ZhzpKTI16CS2RZZ0O1XFrSZ5yMD8gnACnqtOclWH00kI3gYAqx');
        const elements = stripe.elements();
        const cardElement = elements.create('card');
        cardElement.mount('#stripe-card-element-mount-point');

        const urlParams = new URLSearchParams(window.location.search);
        const airport = urlParams.get('airport');
        const destination = urlParams.get('destination');
        const tripType = urlParams.get('tripType');
        const passengers = urlParams.get('passengers');
        const arrivalDate = urlParams.get('arrivalDate');

        let targetTitle = "", targetPrice = "";

        async function fetchQuotes() {
            document.getElementById('resultsHeaderTitle').textContent = `Available Quotes: ${airport || 'Airport'} to ${destination || 'Destination'}`;
            const target = document.getElementById('resultsInjectTarget');
            
            try {
                // Point explicitly to your backend service domain URL
                const response = await fetch('https://zippygotransfersbackend.onrender.com/api/search-transfers', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ airport, destination, tripType, passengers })
                });
                const data = await response.json();
                target.innerHTML = '';

                if (data.success && data.options) {
                    data.options.forEach(deal => {
                        const card = document.createElement('div');
                        card.className = "bg-white border rounded-2xl p-6 flex justify-between items-center shadow-sm text-left";
                        card.innerHTML = `
                            <div>
                                <h3 class="text-lg font-bold text-slate-800">${deal.vehicle}</h3>
                                <p class="text-xs text-slate-400">Includes all baggage allocations & space profiles</p>
                            </div>
                            <div class="text-right">
                                <p class="text-2xl font-black text-slate-900">£${deal.priceGbp}</p>
                                <button type="button" class="bk-btn mt-2 bg-emerald-500 text-white font-bold px-4 py-2 rounded-xl text-xs" data-title="${deal.vehicle}" data-price="${deal.priceGbp}">Select</button>
                            </div>`;
                        target.appendChild(card);
                    });

                    document.querySelectorAll('.bk-btn').forEach(b => {
                        b.addEventListener('click', function() {
                            targetTitle = this.getAttribute('data-title');
                            targetPrice = this.getAttribute('data-price');
                            document.getElementById('checkoutTitle').textContent = `Checkout: ${targetTitle} (£${targetPrice})`;
                            document.getElementById('checkoutTargetFinalPrice').textContent = `£${targetPrice}`;
                            document.getElementById('checkoutTargetVehicleSummary').textContent = `${airport} → ${destination}`;
                            document.getElementById('checkoutModalOverlay').classList.remove('hidden');
                        });
                    });
                }
            } catch (err) { 
                target.innerHTML = '<p class="text-xs text-rose-500">Error connecting to server application backend.</p>'; 
            }
        }

        document.getElementById('closeCheckoutBtn').addEventListener('click', () => {
            document.getElementById('checkoutModalOverlay').classList.add('hidden');
        });

        document.getElementById('checkoutCombinedForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('paySubmitBtn');
            btn.disabled = true; btn.textContent = "Authorizing Funds Layer...";

            try {
                const response = await fetch('https://zippygotransfersbackend.onrender.com/api/create-stripe-payment-intent', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ amount: targetPrice, currency: 'GBP' })
                });
                const intent = await response.json();

                const outcome = await stripe.confirmCardPayment(intent.clientSecret, {
                    payment_method: { card: cardElement, billing_details: { name: document.getElementById('custFirstName').value + ' ' + document.getElementById('custLastName').value } }
                });

                if (outcome.error) {
                    document.getElementById('payment-errors').textContent = outcome.error.message;
                    document.getElementById('payment-errors').classList.remove('hidden');
                } else {
                    const bookingRef = "GT-" + Math.floor(100000 + Math.random() * 900000);
                    const record = {
                        id: bookingRef, name: document.getElementById('custFirstName').value + ' ' + document.getElementById('custLastName').value,
                        email: document.getElementById('custEmail').value, phone: document.getElementById('custPhone').value,
                        flight: document.getElementById('flightNo').value, vehicle: targetTitle, price: targetPrice,
                        from: airport, to: destination, departureDate: arrivalDate, status: "Paid & Verified"
                    };

                    localStorage.setItem(bookingRef, JSON.stringify(record));
                    document.getElementById('checkoutModalOverlay').classList.add('hidden');
                    document.getElementById('resultsInjectTarget').classList.add('hidden');
                    document.getElementById('resultsHeaderTitle').classList.add('hidden');

                    document.getElementById('receiptSummaryBlock').innerHTML = `
                        <p class="border-b pb-2"><span class="text-slate-400">Reference Key:</span> ${bookingRef}</p>
                        <p><span class="text-slate-400">Lead Passenger:</span> ${record.name}</p>
                        <p><span class="text-slate-400">Assigned Transit Fleet:</span> ${record.vehicle}</p>
                        <p class="text-lg font-black text-slate-900 pt-2">Total Charged: £${targetPrice}</p>`;
                    
                    document.getElementById('successReceiptSection').classList.remove('hidden');
                }
            } catch (err) { console.error(err); }
            finally { btn.disabled = false; btn.textContent = "Pay & Complete Reservation →"; }
        });

        window.onload = fetchQuotes;
    </script>
</body>
</html>
