<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zippygo | Fast & Secure Airport Transfers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col antialiased">
    
    <header class="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
            <button type="button" onclick="window.location.reload();" class="text-2xl font-black tracking-tight text-white flex items-center">
                <span class="text-emerald-500 mr-1">Zippy</span>go
            </button>
            <div class="flex items-center space-x-6">
                <a href="/about.html" class="text-sm font-semibold text-slate-300 hover:text-white transition">About Us</a>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl mx-auto px-4 py-12 w-full">
        <div id="searchFormSection" class="space-y-10">
            <div class="text-center max-w-3xl mx-auto space-y-3">
                <h1 class="text-4xl md:text-5xl font-black tracking-tight text-slate-900">Compare Global Transfers, Best Rates</h1>
                <p class="text-slate-500 text-sm md:text-base font-medium">Instantly source live data aggregations with a 100% transparent pricing structure.</p>
            </div>

            <div class="bg-white rounded-3xl border shadow-xl p-6 md:p-8 max-w-4xl mx-auto">
                <form id="searchEngineForm">
                    <div class="flex items-center space-x-6 pb-6 border-b mb-6 text-sm font-bold text-slate-700">
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="radio" name="tripType" value="return" checked class="w-4 h-4 text-emerald-500 focus:ring-emerald-400">
                            <span>🔄 Return Transfer</span>
                        </label>
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="radio" name="tripType" value="oneway" class="w-4 h-4 text-emerald-500 focus:ring-emerald-400">
                            <span>➡️ One Way Transfer</span>
                        </label>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="relative">
                            <label class="block text-xs font-black text-slate-500 uppercase tracking-wider mb-2">Arrival Airport *</label>
                            <input type="text" id="airportLookupIn" required placeholder="Type arrival airport (e.g. Tenerife)..." class="w-full p-4 bg-slate-50 border rounded-2xl text-sm font-medium focus:outline-none">
                            <div id="airportDropdownGrid" class="absolute left-0 right-0 top-full mt-2 bg-white border rounded-2xl shadow-2xl max-h-60 overflow-y-auto hidden z-50"></div>
                        </div>

                        <div class="relative">
                            <label class="block text-xs font-black text-slate-500 uppercase tracking-wider mb-2">Dropoff Hotel / Villa Resort *</label>
                            <input type="text" id="destinationLookupIn" required placeholder="Type hotel or city destination..." class="w-full p-4 bg-slate-50 border rounded-2xl text-sm font-medium focus:outline-none">
                            <div id="destDropdownGrid" class="absolute left-0 right-0 top-full mt-2 bg-white border rounded-2xl shadow-2xl max-h-60 overflow-y-auto hidden z-50"></div>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-black text-slate-500 uppercase tracking-wider mb-2">Arrival Date *</label>
                                <input type="date" id="arrivalDate" required class="w-full p-4 bg-slate-50 border rounded-2xl text-sm font-medium focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-black text-slate-500 uppercase tracking-wider mb-2">Arrival Time *</label>
                                <input type="time" id="arrivalTime" required class="w-full p-4 bg-slate-50 border rounded-2xl text-sm font-medium focus:outline-none">
                            </div>
                        </div>

                        <div id="returnScheduleWrapper" class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-black text-slate-500 uppercase tracking-wider mb-2">Return Date</label>
                                <input type="date" id="returnDate" class="w-full p-4 bg-slate-50 border rounded-2xl text-sm font-medium focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-black text-slate-500 uppercase tracking-wider mb-2">Return Time</label>
                                <input type="time" id="returnTime" class="w-full p-4 bg-slate-50 border rounded-2xl text-sm font-medium focus:outline-none">
                            </div>
                        </div>

                        <div class="md:col-span-2">
                            <label class="block text-xs font-black text-slate-500 uppercase tracking-wider mb-2">Total Passengers</label>
                            <select id="passengerSelect" class="w-full p-4 bg-slate-50 border rounded-2xl text-sm font-semibold focus:outline-none">
                                <option value="1">1 Passenger</option>
                                <option value="2" selected>2 Passengers</option>
                                <option value="4">4 Passengers</option>
                                <option value="6">6 Passengers</option>
                            </select>
                        </div>
                    </div>

                    <div class="mt-8">
                        <button type="submit" id="triggerSearchActionBtn" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-black py-4 rounded-2xl shadow-lg transition tracking-wide text-sm uppercase">Find Best Deals →</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer class="bg-white border-t border-slate-200 py-8 text-center text-xs font-medium text-slate-400">
        <p>© Zippygo.com 2026. All Rights Reserved.</p>
    </footer>

    <script>
        const airIn = document.getElementById('airportLookupIn');
        const airDrop = document.getElementById('airportDropdownGrid');
        const destIn = document.getElementById('destinationLookupIn');
        const destDrop = document.getElementById('destDropdownGrid');
        let airTime, destTime;

        document.querySelectorAll('input[name="tripType"]').forEach(radio => {
            radio.addEventListener('change', function() {
                document.getElementById('returnScheduleWrapper').style.opacity = this.value === 'oneway' ? '0.3' : '1';
            });
        });

        // Autocomplete Engine
        airIn.addEventListener('input', () => {
            clearTimeout(airTime);
            if (airIn.value.length < 2) return;
            airTime = setTimeout(async () => {
                const res = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(airIn.value + ' airport')}&limit=5`);
                const data = await res.json();
                airDrop.innerHTML = ''; airDrop.classList.remove('hidden');
                data.features.forEach(f => {
                    const d = document.createElement('div');
                    d.className = "p-3 hover:bg-slate-50 cursor-pointer border-b text-sm";
                    d.textContent = f.properties.name;
                    d.addEventListener('click', () => { airIn.value = f.properties.name; airDrop.classList.add('hidden'); });
                    airDrop.appendChild(d);
                });
            }, 300);
        });

        destIn.addEventListener('input', () => {
            clearTimeout(destTime);
            if (destIn.value.length < 2) return;
            destTime = setTimeout(async () => {
                const res = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(destIn.value)}&limit=5`);
                const data = await res.json();
                destDrop.innerHTML = ''; destDrop.classList.remove('hidden');
                data.features.forEach(f => {
                    const d = document.createElement('div');
                    d.className = "p-3 hover:bg-slate-50 cursor-pointer border-b text-sm";
                    d.textContent = f.properties.name;
                    d.addEventListener('click', () => { destIn.value = f.properties.name; destDrop.classList.add('hidden'); });
                    destDrop.appendChild(d);
                });
            }, 300);
        });

        // Redirect form submission directly to the isolated prices page
        document.getElementById('searchEngineForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const tripType = document.querySelector('input[name="tripType"]:checked').value;
            const params = new URLSearchParams({
                airport: airIn.value,
                destination: destIn.value,
                tripType: tripType,
                passengers: document.getElementById('passengerSelect').value,
                arrivalDate: document.getElementById('arrivalDate').value
            });
            window.location.href = `/results.html?${params.toString()}`;
        });
    </script>
</body>
</html>
